
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seamless GIF Table</title>

<style>
html, body{
    margin:0;
    padding:0;
    background:#fff;
}

table{
    border-collapse:collapse;
    border-spacing:0;
    width:50%;
}

td{
    padding:0;
    margin:0;
    line-height:0;
}

img{
    display:block;
    width:100%;
    height:auto;
    border:0;
}
</style>
</head>

<body>

<table>
    <tr>
        <td><img src="https://raw.githubusercontent.com/bbbry12/da-ac-res/refs/heads/main/D1.gif" alt="GIF 1"></td>
